name: VPS Heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vps-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    env:
      MONITOR_URL: ${{ secrets.MONITOR_URL }}
      TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n "$MONITOR_URL" || {
            echo "::error::MONITOR_URL is empty"
            exit 1
          }

          test -n "$TG_BOT_TOKEN" || {
            echo "::error::TELEGRAM_BOT_TOKEN is empty"
            exit 1
          }

          test -n "$TG_CHAT_ID" || {
            echo "::error::TELEGRAM_CHAT_ID is empty"
            exit 1
          }

      - name: Check VPS and notify on state change
        shell: bash
        run: |
          set -euo pipefail

          STATE_LABEL="heartbeat-state"

          send_telegram() {
            local text="$1"

            curl \
              --silent \
              --show-error \
              --fail \
              --retry 2 \
              --connect-timeout 10 \
              --max-time 20 \
              -X POST \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=${text}" \
              >/dev/null
          }

          check_once() {
            local tmp code

            tmp="$(mktemp)"

            code="$(
              curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 8 \
                --max-time 15 \
                --output "$tmp" \
                --write-out "%{http_code}" \
                "$MONITOR_URL" \
                2>/dev/null \
              || true
            )"

            if [[ "$code" == "200" ]] && grep -q '^mixed-port:' "$tmp"; then
              rm -f "$tmp"
              return 0
            fi

            rm -f "$tmp"
            return 1
          }

          gh label create "$STATE_LABEL" \
            --repo "$REPO" \
            --color "B60205" \
            --description "Managed automatically by VPS heartbeat" \
            --force \
            >/dev/null 2>&1 || true

          OK=0

          for attempt in 1 2 3; do
            echo "Heartbeat attempt ${attempt}/3"

            if check_once; then
              OK=1
              break
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep 10
            fi
          done

          DOWN_ISSUE="$(
            gh issue list \
              --repo "$REPO" \
              --state open \
              --label "$STATE_LABEL" \
              --limit 10 \
              --json number \
              --jq '.[0].number // ""'
          )"

          NOW="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          if [[ "$OK" -eq 1 ]]; then

            echo "HTTPS heartbeat OK"

            if [[ -n "$DOWN_ISSUE" ]]; then

              printf -v MSG \
                '🟢 VPS 已恢复\n\n时间：%s\n\n外部 HTTPS 心跳恢复正常。VPS / Nginx / TLS / Clash 订阅地址目前可访问。' \
                "$NOW"

              send_telegram "$MSG"

              gh issue close "$DOWN_ISSUE" \
                --repo "$REPO" \
                --comment "Recovered at ${NOW}." \
                >/dev/null

              echo "Recovery notification sent."
            fi

          else

            echo "::warning::VPS HTTPS heartbeat failed 3 consecutive checks."

            if [[ -z "$DOWN_ISSUE" ]]; then

              printf -v MSG \
                '🔴 VPS 外部心跳异常\n\n时间：%s\n\nGitHub Actions 连续 3 次无法通过 HTTPS 健康检查。\n\n可能原因：VPS 离线、网络异常、Nginx/443 异常、TLS 证书异常或订阅文件不可访问。' \
                "$NOW"

              send_telegram "$MSG"

              ISSUE_URL="$(
                gh issue create \
                  --repo "$REPO" \
                  --title "VPS heartbeat DOWN" \
                  --label "$STATE_LABEL" \
                  --body "External HTTPS heartbeat failed three consecutive checks at ${NOW}."
              )"

              echo "First DOWN event recorded: ${ISSUE_URL}"

            else

              echo "VPS is still down; duplicate Telegram alert skipped."

            fi
          fi
