name: VPS Heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vps-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    env:
      MONITOR_HOST: ${{ secrets.MONITOR_HOST }}
      # sing-box VLESS entry; keep this visible so a retired secret cannot drift.
      MONITOR_PORT: "443"
      TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n "$MONITOR_HOST" && test -n "$MONITOR_PORT" || {
            echo "::error::MONITOR_HOST or MONITOR_PORT is empty"
            exit 1
          }

          test -n "$TG_BOT_TOKEN" || {
            echo "::error::TELEGRAM_BOT_TOKEN is empty"
            exit 1
          }

          test -n "$TG_CHAT_ID" || {
            echo "::error::TELEGRAM_CHAT_ID is empty"
            exit 1
          }

      - name: Check VPS and notify on state change
        shell: bash
        run: |
          set -euo pipefail

          STATE_LABEL="heartbeat-state"

          send_telegram() {
            local text="$1"

            curl \
              --silent \
              --show-error \
              --fail \
              --retry 2 \
              --connect-timeout 10 \
              --max-time 20 \
              -X POST \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=${text}" \
              >/dev/null
          }

          check_once() {
            python3 - <<'PY'
          import os, socket, sys
          try:
              host = os.environ['MONITOR_HOST']
              port = int(os.environ['MONITOR_PORT'])
              if not host or not 1 <= port <= 65535:
                  raise ValueError('invalid target')
              with socket.create_connection((host, port), timeout=8):
                  pass
          except (OSError, ValueError, KeyError):
              print('sing-box VLESS TCP probe failed; target withheld')
              sys.exit(1)
          print('sing-box VLESS TCP probe passed; target withheld')
          PY
          }

          gh label create "$STATE_LABEL" \
            --repo "$REPO" \
            --color "B60205" \
            --description "Managed automatically by VPS heartbeat" \
            --force \
            >/dev/null 2>&1 || true

          OK=0

          for attempt in 1 2 3; do
            echo "Heartbeat attempt ${attempt}/3"

            if check_once; then
              OK=1
              break
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep 10
            fi
          done

          DOWN_ISSUE="$(
            gh issue list \
              --repo "$REPO" \
              --state open \
              --label "$STATE_LABEL" \
              --limit 10 \
              --json number \
              --jq '.[0].number // ""'
          )"

          NOW="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          if [[ "$OK" -eq 1 ]]; then

            echo "sing-box VLESS TCP heartbeat OK"

            if [[ -n "$DOWN_ISSUE" ]]; then

              printf -v MSG \
                '🟢 VPS 外部检查正常\n\n时间：%s\n\nsing-box VLESS TCP/443 公网检查正常。检查已切换到当前 sing-box 入口，不再检查退役的旧 Reality 端口；原告警已解除。仅验证 TCP 端口可达，不代表代理认证、出站或 HY2/UDP 正常。' \
                "$NOW"

              send_telegram "$MSG"

              gh issue close "$DOWN_ISSUE" \
                --repo "$REPO" \
                --comment "Recovered at ${NOW}." \
                >/dev/null

              echo "Recovery notification sent."
            fi

          else

            echo "::warning::sing-box VLESS TCP heartbeat failed 3 consecutive checks."

            if [[ -z "$DOWN_ISSUE" ]]; then

              printf -v MSG \
                '🔴 VPS 外部心跳异常\n\n时间：%s\n\nGitHub Actions 本次运行连续 3 次无法连接 sing-box VLESS TCP/443。\n\n可能原因：VPS 离线、外部网络异常、防火墙限制或 sing-box TCP 监听不可达。仅检查 TCP 入口，不验证代理认证或 HY2/UDP，也不会自动重启主机。' \
                "$NOW"

              send_telegram "$MSG"

              ISSUE_URL="$(
                gh issue create \
                  --repo "$REPO" \
                  --title "VPS heartbeat DOWN" \
                  --label "$STATE_LABEL" \
                  --body "External sing-box VLESS TCP/443 heartbeat failed three consecutive checks at ${NOW}."
              )"

              echo "First DOWN event recorded: ${ISSUE_URL}"

            else

              echo "VPS is still down; duplicate Telegram alert skipped."

            fi
          fi
