name: Keep Scheduled Workflows Alive

on:
  schedule:
    - cron: "17 4 1 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update activity marker
        shell: bash
        run: |
          date -u '+%Y-%m-%d %H:%M:%S UTC' > .heartbeat-keepalive

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .heartbeat-keepalive
          git commit -m "chore: heartbeat keepalive" || exit 0
          git push
